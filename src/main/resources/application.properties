spring.application.name=backendnpu

spring.datasource.url=jdbc:mysql://localhost:3306/ecomarket?createDatabaseIfNotExist=true


spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

#server.port=8081

spring.jpa.show-sql=true
# En caso que se use hibernate para que no haya problemas con la bdd
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

#update actualiza todo de nuevo
# none no hace nada  validate para que no hayan sin modificaciones automáticas.

# Si vas a usar diferentes perfiles test  o none en nuestro caso
spring.profiles.active=test


# Desactivar advertencias
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false

# Configuración JWT
jwt.secretKey=kfQ3PKM!xM9t3Rv6Lsp0yBxeWZf7rQJvZt9kXXXzN$5
jwt.expirationMs=86400000 



# Google Cloud Storage
gcp.storage.project-id=tu-proyecto-id
gcp.storage.bucket-name=tu-bucket
gcp.storage.credentials-file-path=service-account.json

# Configuración de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
