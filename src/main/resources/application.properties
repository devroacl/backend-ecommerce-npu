spring.application.name=backendnpu

spring.datasource.url=jdbc:mysql://localhost:3306/ecomarket?createDatabaseIfNotExist=true


spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

server.port=8081

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
#update actualiza todo de nuevo
